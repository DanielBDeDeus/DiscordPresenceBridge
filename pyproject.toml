[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-presence-bridge"
version = "0.1.0"
description = "Cross-platform configurable Discord desktop activity bridge"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Daniel Barros de Deus"}]
dependencies = [
  "PySide6>=6.7",
  "psutil>=5.9",
  "platformdirs>=4.2",
  "Pillow>=10.4",
  "dbus-next>=0.2.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
presence-bridge = "presence_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
